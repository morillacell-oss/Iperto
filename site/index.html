<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fffaf7" />
  <meta name="description" content="Junta — compre com outras pessoas e pague mais barato." />
  <title>Junta — Compre junto. Pague menos.</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preconnect" href="https://rrulyvkarrwbopqeciyz.supabase.co" crossorigin />
  <link rel="dns-prefetch" href="//rrulyvkarrwbopqeciyz.supabase.co" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="dns-prefetch" href="//cdn.jsdelivr.net" />
  <link rel="stylesheet" href="/app-v100.css?v=102" />
  <style>
    .j-overlay[hidden], .j-bottom-nav[hidden], [hidden] { display: none !important; }

    /* Seller segmented navigation — compact, premium and mobile-safe */
    body[data-role="seller"] .j-tabbar {
      display: grid !important;
      grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
      gap: 6px !important;
      overflow: visible !important;
      margin: 14px 0 18px !important;
      padding: 6px !important;
      background: rgba(255,255,255,.96) !important;
      border: 1px solid rgba(70,45,35,.08) !important;
      border-radius: 18px !important;
      box-shadow: 0 10px 28px rgba(61,31,20,.055), inset 0 1px 0 rgba(255,255,255,.9) !important;
    }

    body[data-role="seller"] .j-tabbar > button {
      width: 100% !important;
      min-width: 0 !important;
      min-height: 48px !important;
      padding: 0 10px !important;
      border: 0 !important;
      border-radius: 13px !important;
      background: transparent !important;
      color: #756d68 !important;
      font-size: 14px !important;
      font-weight: 850 !important;
      line-height: 1.15 !important;
      text-align: center !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
      box-shadow: none !important;
      transform: none !important;
      transition: background .18s ease, color .18s ease, box-shadow .18s ease, transform .14s ease !important;
      touch-action: manipulation !important;
      -webkit-tap-highlight-color: transparent !important;
    }

    body[data-role="seller"] .j-tabbar > button:active {
      transform: scale(.985) !important;
    }

    body[data-role="seller"] .j-tabbar > button.active {
      background: linear-gradient(180deg, #fff3f1 0%, #ffe8e5 100%) !important;
      color: #ef2f2d !important;
      box-shadow: 0 7px 18px rgba(239,47,45,.10), inset 0 1px 0 rgba(255,255,255,.9) !important;
    }

    body[data-role="seller"] .j-tabbar > button[data-new-offer] {
      display: none !important;
    }

    @media (max-width: 420px) {
      body[data-role="seller"] .j-tabbar {
        gap: 4px !important;
        padding: 5px !important;
        border-radius: 16px !important;
      }

      body[data-role="seller"] .j-tabbar > button {
        min-height: 46px !important;
        padding: 0 6px !important;
        font-size: 13px !important;
        letter-spacing: -.01em !important;
        border-radius: 12px !important;
      }
    }

    @media (max-width: 360px) {
      body[data-role="seller"] .j-tabbar > button {
        font-size: 12px !important;
        padding: 0 4px !important;
      }
    }
  </style>
</head>
<body>
  <header class="j-topbar" id="topbar">
    <div class="j-shell j-topbar-inner">
      <button class="j-brand" id="brandBtn" aria-label="Junta"><span class="j-brand-mark"><i></i><i></i></span><span>JUNTA</span></button>
      <div class="j-top-actions">
        <button class="j-icon-btn" id="searchBtn" aria-label="Buscar"><svg viewBox="0 0 24 24"><path d="m21 21-4.4-4.4m2.4-5.6a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg></button>
        <button class="j-avatar-btn" id="avatarBtn" aria-label="Conta"><span id="avatarContent">J</span></button>
      </div>
    </div>
  </header>

  <main id="app" class="j-app" aria-live="polite"></main>

  <nav class="j-bottom-nav" id="bottomNav" hidden></nav>

  <div class="j-overlay" id="overlay" hidden></div>
  <div class="j-toast" id="toast" role="status" aria-live="polite"></div>

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="/app-v100.js?v=102"></script>
</body>
</html>
